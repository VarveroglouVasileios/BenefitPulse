<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="55" fill="#4F46E5" opacity="0.1"/>
  
  <!-- Main pulse/heart icon -->
  <g transform="translate(60, 60)">
    <!-- Pulse waves -->
    <circle cx="0" cy="0" r="25" fill="none" stroke="#4F46E5" stroke-width="2" opacity="0.3">
      <animate attributeName="r" values="25;35;25" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#4F46E5" stroke-width="2" opacity="0.3">
      <animate attributeName="r" values="25;35;25" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Heart/benefit icon -->
    <path d="M 0,-15 C -8,-20 -15,-15 -15,-8 C -15,-3 -10,2 0,12 C 10,2 15,-3 15,-8 C 15,-15 8,-20 0,-15 Z" 
          fill="#4F46E5" stroke="#4F46E5" stroke-width="1.5"/>
    
    <!-- Plus sign in center -->
    <line x1="0" y1="-5" x2="0" y2="5" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Text "BP" small -->
  <text x="60" y="95" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4F46E5" text-anchor="middle">BP</text>
</svg>

